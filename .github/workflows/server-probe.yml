# Temporary: sends the same requests the mobile app sends to the live site
# and prints exactly what comes back, to find out why sign-in fails there.
name: Server probe (temporary)
on:
  push:
    branches: [claude/kounselia-mobile-app-et9qi9]
    paths: ['.github/workflows/server-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          URL=https://kounselia.com/portal/wp-admin/admin-ajax.php
          probe() {
            echo "=================== $1"
            shift
            curl -sS -m 30 -o body.txt -D headers.txt -w "HTTP %{http_code}  type=%{content_type}\n" "$@" || echo "curl failed: $?"
            grep -iE '^(server|content-type|x-|set-cookie: ?(ak|__cf|incap|visid))' headers.txt || true
            echo "--- body (first 600 bytes):"; head -c 600 body.txt; echo; echo
          }
          # Exactly what the app sends (React Native on Android uses okhttp).
          probe "app login, okhttp UA" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Accept: application/json, text/plain, */*" \
            -H "Content-Type: application/x-www-form-urlencoded" -H "X-Kounselia-Client: app" \
            --data "action=kounselia_app_login&email=probe-nobody%40example.com&password=not-a-real-password&device_name=probe"
          probe "app login, no custom header" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" \
            --data "action=kounselia_app_login&email=probe-nobody%40example.com&password=not-a-real-password"
          probe "app login, browser UA" -X POST "$URL" \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36" \
            -H "Content-Type: application/x-www-form-urlencoded" -H "X-Kounselia-Client: app" \
            --data "action=kounselia_app_login&email=probe-nobody%40example.com&password=not-a-real-password"
          probe "app_me with a fake token" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" \
            -H "X-Kounselia-Client: app" -H "X-Kounselia-Token: $(printf 'a%.0s' $(seq 64))" \
            --data "action=kounselia_app_me"
          probe "counselors GET" "$URL?action=kounselia_get_counselors" -H "User-Agent: okhttp/4.12.0"
