# Temporary: sends the same requests the mobile app sends to the live site
# and prints exactly what comes back, to find out why sign-in fails there.
name: Server probe (temporary)
on:
  push:
    branches: [claude/kounselia-mobile-app-et9qi9]
    paths: ['.github/workflows/server-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          URL=https://kounselia.com/portal/wp-admin/admin-ajax.php
          probe() {
            echo "=================== $1"
            shift
            curl -sS -m 30 -o body.txt -D headers.txt -w "HTTP %{http_code}  type=%{content_type}\n" "$@" || echo "curl failed: $?"
            grep -iE '^(server|content-type|x-|set-cookie: ?(ak|__cf|incap|visid))' headers.txt || true
            echo "--- body (first 600 bytes):"; head -c 600 body.txt; echo; echo
          }
          CH="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          probe "POST counselors (no password, nothing unusual)" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" \
            --data "action=kounselia_get_counselors"
          probe "POST counselors, full browser headers" -X POST "$URL" \
            -H "User-Agent: $CH" -H "Accept: */*" -H "Accept-Language: en-US,en;q=0.9" \
            -H "Origin: https://kounselia.com" -H "Referer: https://kounselia.com/talk.php" \
            -H "Content-Type: application/x-www-form-urlencoded" --data "action=kounselia_get_counselors"
          probe "POST counselors, Origin+Referer only" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Origin: https://kounselia.com" -H "Referer: https://kounselia.com/" \
            -H "Content-Type: application/x-www-form-urlencoded" --data "action=kounselia_get_counselors"
          probe "POST counselors, Accept-Language only" -X POST "$URL" \
            -H "User-Agent: okhttp/4.12.0" -H "Accept-Language: en-US,en;q=0.9" \
            -H "Content-Type: application/x-www-form-urlencoded" --data "action=kounselia_get_counselors"
          probe "POST counselors, multipart" -X POST "$URL" -H "User-Agent: okhttp/4.12.0" -F "action=kounselia_get_counselors"
          probe "POST counselors, JSON body" -X POST "$URL?action=kounselia_get_counselors" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/json" --data '{}'
          probe "POST counselors, empty body, action in URL" -X POST "$URL?action=kounselia_get_counselors" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Length: 0"
          probe "POST counselors, action in URL, form body" -X POST "$URL?action=kounselia_get_counselors" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" --data "x=1"
          probe "POST to site root (not admin-ajax)" -X POST "https://kounselia.com/" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" --data "x=1"
          probe "POST to wp-login.php" -X POST "https://kounselia.com/portal/wp-login.php" \
            -H "User-Agent: $CH" -H "Content-Type: application/x-www-form-urlencoded" --data "log=probe&pwd=probe"
          probe "POST to REST API" -X POST "https://kounselia.com/portal/wp-json/" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/json" --data '{}'
          probe "GET REST API root" "https://kounselia.com/portal/wp-json/" -H "User-Agent: okhttp/4.12.0"
          probe "GET app_me with app header" "$URL?action=kounselia_app_me" \
            -H "User-Agent: okhttp/4.12.0" -H "X-Kounselia-Client: app" -H "X-Kounselia-Token: $(printf 'a%.0s' $(seq 64))"
