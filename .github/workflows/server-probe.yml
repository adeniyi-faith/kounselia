# Temporary: sends the same requests the mobile app sends to the live site
# and prints exactly what comes back, to find out why sign-in fails there.
name: Server probe (temporary)
on:
  push:
    branches: [claude/kounselia-mobile-app-et9qi9]
    paths: ['.github/workflows/server-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          URL=https://kounselia.com/portal/wp-admin/admin-ajax.php
          probe() {
            echo "=================== $1"
            shift
            curl -sS -m 30 -o body.txt -D headers.txt -w "HTTP %{http_code}  type=%{content_type}\n" "$@" || echo "curl failed: $?"
            grep -iE '^(server|content-type|x-|set-cookie: ?(ak|__cf|incap|visid))' headers.txt || true
            echo "--- body (first 600 bytes):"; head -c 600 body.txt; echo; echo
          }
          O=(-H "Origin: https://kounselia.com" -H "Referer: https://kounselia.com/")
          probe "app login + Origin/Referer (exactly as the fixed app)" -X POST "$URL" "${O[@]}" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" -H "X-Kounselia-Client: app" \
            --data "action=kounselia_app_login&email=probe-nobody%40example.com&password=not-a-real-password&device_name=probe"
          probe "app register validation + Origin/Referer (short password, creates nothing)" -X POST "$URL" "${O[@]}" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" -H "X-Kounselia-Client: app" \
            --data "action=kounselia_app_register&name=Probe&email=not-an-email&password=x"
          probe "app_me POST + token + Origin/Referer" -X POST "$URL" "${O[@]}" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" \
            -H "X-Kounselia-Client: app" -H "X-Kounselia-Token: $(printf 'a%.0s' $(seq 64))" --data "action=kounselia_app_me"
          probe "Referer only" -X POST "$URL" -H "Referer: https://kounselia.com/" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" --data "action=kounselia_get_counselors"
          probe "Origin only" -X POST "$URL" -H "Origin: https://kounselia.com" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" --data "action=kounselia_get_counselors"
          B64=$(head -c 60000 /dev/urandom | base64 -w0 | sed 's/+/%2B/g;s/\//%2F/g;s/=/%3D/g')
          probe "big base64 body (like voice/photo upload) + Origin/Referer" -X POST "$URL" "${O[@]}" \
            -H "User-Agent: okhttp/4.12.0" -H "Content-Type: application/x-www-form-urlencoded" -H "X-Kounselia-Client: app" \
            --data "action=kounselia_get_counselors&audio_b64=$B64"
          exit 0
