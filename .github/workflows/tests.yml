name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phpunit:
    name: PHPUnit (mu-plugins)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install subversion
        # bin/install-wp-tests.sh checks out the WP core test framework via
        # svn (the way WordPress core itself has always distributed it) —
        # not present on the ubuntu-latest runner image by default.
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress core + test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress

      - name: Run PHPUnit
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  javascript:
    name: Web chat, mobile app & shared core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # packages/core is shared by both apps, and must stay free of
      # browser-only code so the mobile app can use it.
      - name: Typecheck shared core
        working-directory: packages/core
        run: npm ci && npm run typecheck

      - name: Build web chat
        working-directory: chat-app
        run: npm ci && npm run build

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm ci && npm run typecheck && npx expo-doctor
