
<div class="screen" id="chat" onclick="closeChatMenu()">
  <div class="chat-nav">
    <button class="back-btn" onclick="goBack()" aria-label="Go back"><i class="ti ti-arrow-left"></i></button>
    <div class="chat-av-sm" id="chat-avatar"></div>
    <div class="chat-info">
      <h3 id="chat-name-wrap">
        <span id="chat-name">—</span>
        <span class="trust-badge" title="Verified Counselor"><i class="ti ti-check"></i></span>
      </h3>
      <p id="chat-spec">—</p>
    </div>
    
    <div class="nav-actions">
      <button class="icon-btn action-call" id="voice-call-btn" onclick="startVoiceCall()" title="Start voice conversation" style="display:none"><i class="ti ti-phone"></i></button>
      <button class="icon-btn" title="Load Chat History" onclick="fetchAndDisplayHistory(event)"><i class="ti ti-history"></i></button>
      <button class="icon-btn" title="More options" onclick="toggleChatMenu(event)"><i class="ti ti-dots-vertical"></i></button>
    </div>
  </div>
  
  <div class="chat-dropdown" id="chat-dropdown">
    <div class="chat-dropdown-item" onclick="exportChat(event)">
      <i class="ti ti-download"></i> Export chat
    </div>
    <div class="chat-dropdown-item" style="color: var(--rose);" onclick="clearCurrentChat(event)">
      <i class="ti ti-trash" style="color: inherit;"></i> Clear chat
    </div>
    <div class="chat-dropdown-item" style="border-top: 1px solid var(--border);" onclick="goToUpgrade(event)">
      <i class="ti ti-sparkles" style="color: var(--gold);"></i> Upgrade
    </div>
  </div>
  
  <div class="messages" id="messages"></div>
  
  <div class="chat-footer">
    <div id="limit-area"></div>
    
    <div class="upgraded-input-area">
      <div class="input-pill">
        <button class="pill-icon" title="Expressions" onclick="showChatToast('Emoji picker coming soon')"><i class="ti ti-mood-smile"></i></button>
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="Message" onkeydown="handleKey(event)" oninput="handleInputStyling(this)"></textarea>
      </div>
      
      <button class="dynamic-fab" id="dynamic-fab" onclick="handleDynamicAction()" aria-label="Voice or Send">
        <i class="ti ti-microphone" id="dynamic-fab-icon"></i>
      </button>
    </div>
  </div>

  <div class="call-overlay" id="call-overlay">
    <button class="call-close" id="call-close-btn" onclick="endVoiceCall()" aria-label="End call"><i class="ti ti-x"></i></button>
    <div class="call-status" id="call-status">Connecting…</div>
    <div class="call-avatar-wrap">
      <div class="call-avatar" id="call-avatar"></div>
      <div class="call-ring" id="call-ring"></div>
    </div>
    <div class="call-name" id="call-name">—</div>
    <div class="call-timer" id="call-timer">00:00</div>
    <div class="call-caption" id="call-caption"></div>
    <div class="call-controls">
      <button class="call-ctrl-btn" id="call-mute-btn" onclick="toggleVoiceMute()" aria-label="Mute"><i class="ti ti-microphone"></i></button>
      <button class="call-ctrl-btn end" onclick="endVoiceCall()" aria-label="End call"><i class="ti ti-phone-x"></i></button>
    </div>
    <p class="call-plan-note" id="call-plan-note"></p>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="outsideClose(event)">
  <div class="modal" id="modal-box">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    <div id="modal-content"></div>
  </div>
</div>
