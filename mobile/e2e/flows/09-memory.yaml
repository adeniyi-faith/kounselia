appId: com.kounselia.app
---
- launchApp
- extendedWaitUntil:
    visible: "Talk to someone now"
    timeout: 60000
- tapOn: "Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Memory profile"
    direction: DOWN
- tapOn: "Memory profile"
- waitForAnimationToEnd
- takeScreenshot: ${P}21-memory
